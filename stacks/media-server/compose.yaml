x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

x-hardened: &hardened
  <<: *common
  cap_drop:
    - ALL

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11
    <<: *common
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/jellyfin/config:/config
      - ${SERVICES_DIR}/jellyfin/transcodes:/transcodes
      - ${DATA_DIR}/media:/storage/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.entrypoints=https"
      - "traefik.http.routers.jellyfin.rule=Host(`${SUB_DOMAIN_JELLYFIN}.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.0.1
    <<: *hardened
    init: true
    environment:
      - LOG_LEVEL=info
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/seerr/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.entrypoints=https"
      - "traefik.http.routers.seerr.rule=Host(`${SUB_DOMAIN_SEERR}.${DOMAIN}`)"
      - "traefik.http.routers.seerr.tls=true"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0
    <<: *hardened
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/radarr:/config
      - ${DATA_DIR}/media/movies:/storage/media/movies
      - ${DATA_DIR}/media/downloads/usenet:/storage/downloads
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.entrypoints=https"
      - "traefik.http.routers.radarr.rule=Host(`${SUB_DOMAIN_RADARR}.${DOMAIN}`)"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    <<: *hardened
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/sonarr:/config
      - ${DATA_DIR}/media/tv:/storage/media/tv
      - ${DATA_DIR}/media/downloads/usenet:/storage/downloads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.entrypoints=https"
      - "traefik.http.routers.sonarr.rule=Host(`${SUB_DOMAIN_SONARR}.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    <<: *hardened
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/prowlarr:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.entrypoints=https"
      - "traefik.http.routers.prowlarr.rule=Host(`${SUB_DOMAIN_PROWLARR}.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:latest
    <<: *hardened
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6868/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/profilarr/config:/config
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
      - ORIGIN=https://${SUB_DOMAIN_PROFILARR}.${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.profilarr.entrypoints=https"
      - "traefik.http.routers.profilarr.rule=Host(`${SUB_DOMAIN_PROFILARR}.${DOMAIN}`)"
      - "traefik.http.routers.profilarr.tls=true"
      - "traefik.http.services.profilarr.loadbalancer.server.port=6868"

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    <<: *hardened
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6767/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/bazarr/config:/config
      - ${DATA_DIR}/media/movies:/storage/media/movies
      - ${DATA_DIR}/media/tv:/storage/media/tv
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.entrypoints=https"
      - "traefik.http.routers.bazarr.rule=Host(`${SUB_DOMAIN_BAZARR}.${DOMAIN}`)"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"

  decypharr:
    image: cy01/blackhole:v2.5
    <<: *common
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    volumes:
      - /mnt/:/mnt:rshared
      - ${SERVICES_DIR}/decypharr/configs:/app
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse:rwm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.decypharr.entrypoints=https"
      - "traefik.http.routers.decypharr.rule=Host(`${SUB_DOMAIN_DECYPHARR}.${DOMAIN}`)"
      - "traefik.http.routers.decypharr.tls=true"
      - "traefik.http.services.decypharr.loadbalancer.server.port=8282"

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.2
    <<: *hardened
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/sabnzbd/config:/config
      - ${DATA_DIR}/media/downloads/incomplete:/storage/incomplete
      - ${DATA_DIR}/media/downloads/usenet:/storage/downloads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.entrypoints=https"
      - "traefik.http.routers.sabnzbd.rule=Host(`${SUB_DOMAIN_SABNZBD}.${DOMAIN}`)"
      - "traefik.http.routers.sabnzbd.tls=true"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8085"

networks:
  default:
    name: internal
    external: true
