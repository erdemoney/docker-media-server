---
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    restart: unless-stopped
    networks:
      - external
      - internal
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/jellyfin/config:/config
      - ${SERVICES_DIR}/jellyfin/transcodes:/transcodes
      - ${DATA_DIR}/media:/storage/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`${SUB_DOMAIN_JELLYFIN}.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.http.routers.jellyfin.entrypoints=https,external-https"
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    restart: unless-stopped
    networks:
      - external
      - internal
    environment:
      - LOG_LEVEL=debug
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/jellyseerr/config:/app/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`${SUB_DOMAIN_JELLYSEERR}.${DOMAIN}`)"
      - "traefik.http.routers.jellyseerr.tls=true"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
      - "traefik.http.routers.jellyseerr.entrypoints=https,external-https"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/radarr:/config
      - ${DATA_DIR}/media/movies:/storage/media/movies
      - ${DATA_DIR}/downloads:/storage/downloads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`${SUB_DOMAIN_RADARR}.${DOMAIN}`)"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.http.routers.radarr.entrypoints=https"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/sonarr:/config
      - ${DATA_DIR}/media/tv:/storage/media/tv
      - ${DATA_DIR}/downloads:/storage/downloads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`${SUB_DOMAIN_SONARR}.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.http.routers.sonarr.entrypoints=https"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/prowlarr:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`${SUB_DOMAIN_PROWLARR}.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.routers.prowlarr.entrypoints=https"

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr
    restart: unless-stopped
    user: ${ENV_PUID}:${ENV_PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/recyclarr/config:/config

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    restart: unless-stopped
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SERVICES_DIR}/sabnzbd/config:/config
      - ${DATA_DIR}/downloads/usenet:/storage/downloads/usenet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`${SUB_DOMAIN_SABNZBD}.${DOMAIN}`)"
      - "traefik.http.routers.sabnzbd.tls=true"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8085"
      - "traefik.http.routers.sabnzbd.entrypoints=https"

networks:
  default:
    name: internal
    external: true

  internal:
    external: true

  external:
    external: true
